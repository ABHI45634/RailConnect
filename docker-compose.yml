services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: train_management
      POSTGRES_USER: train
      POSTGRES_PASSWORD: train
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U train -d train_management"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://train:train@db:5432/train_management
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
